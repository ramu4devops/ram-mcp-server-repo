[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

[program:challenge1-sse]
command=python /app/challenges/challenge1/server_sse.py
stdout_logfile=/var/log/supervisor/challenge1_sse.log
stderr_logfile=/var/log/supervisor/challenge1_sse.err
autostart=true
autorestart=true

[program:challenge1-http]
command=python /app/challenges/challenge1/server_http.py
stdout_logfile=/var/log/supervisor/challenge1_http.log
stderr_logfile=/var/log/supervisor/challenge1_http.err
autostart=true
autorestart=true

